services:
  postgres:
    image: postgres:17-alpine
    container_name: ebano-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ebano
    volumes:
      - ebano_pgdata:/var/lib/postgresql/data

volumes:
  ebano_pgdata:
